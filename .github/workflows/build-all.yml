name: Build All Components

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-producer:
    uses: ./.github/workflows/build-producer.yml
    secrets: inherit

  build-consumer:
    uses: ./.github/workflows/build-consumer.yml
    secrets: inherit

  build-arbiter:
    uses: ./.github/workflows/build-arbiter.yml
    secrets: inherit

  build-controller:
    uses: ./.github/workflows/build-controller.yml
    secrets: inherit

  build-test-orchestrator:
    uses: ./.github/workflows/build-test-orchestrator.yml
    secrets: inherit

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: azure/setup-helm@v5
        with:
          version: 'v3.15.0'
      - name: Lint all Helm charts
        run: |
          for chart in components/*/helm; do
            echo "Linting $chart..."
            if [ -f "$chart/Chart.yaml" ] && grep -q "^dependencies:" "$chart/Chart.yaml"; then
              helm dependency update "$chart"
            fi
            helm lint "$chart"
          done
