name: Build Test Orchestrator

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'components/test-orchestrator/**'
      - '.github/workflows/build-test-orchestrator.yml'
  pull_request:
    paths:
      - 'components/test-orchestrator/**'
  workflow_call:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/hamq-test-orchestrator

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r components/test-orchestrator/backend/requirements.txt
      - name: Run tests
        run: pytest components/test-orchestrator/backend/tests/ -v
        env:
          AUTH_USERNAME: admin
          AUTH_SECRET_KEY: test-secret-key
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          KAFKA_TLS_ENABLED: "false"

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Read version
        id: version
        run: echo "value=$(cat components/test-orchestrator/VERSION)" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v7
        with:
          context: components/test-orchestrator
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  container-smoke-test:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run container smoke test
        run: |
          IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" | tr '[:upper:]' '[:lower:]')
          export IMAGE
          bash components/test-orchestrator/tests/test_container.sh
