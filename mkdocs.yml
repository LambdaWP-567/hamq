site_name: HAMq Documentation
site_description: Highly Available Message Queue System on Kubernetes
site_url: https://lambdawp-567.github.io/hamq/
repo_url: https://github.com/lambdawp-567/hamq
repo_name: lambdawp-567/hamq

theme:
  name: material
  language: de
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Dunkelmodus
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Hellmodus
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: [de, en]
  - minify:
      minify_html: true

nav:
  - Home: README.md
  - Architektur: docs/architecture.md
  - Erste Schritte: docs/getting-started.md
  - Deployment: docs/deployment.md
  - Komponenten:
    - Kafka Cluster: docs/components/kafka-cluster.md
    - Producer: docs/components/producer.md
    - Consumer: docs/components/consumer.md
    - Schiedsrichter: docs/components/arbiter.md
    - Controller: docs/components/controller.md
  - CI/CD: docs/ci-cd.md
  - API Referenz: docs/api-reference.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/lambdawp-567/hamq

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - def_list
  - footnotes
