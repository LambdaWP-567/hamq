image:
  backend:
    repository: ghcr.io/lambdawp-567/hamq-controller
    tag: latest
    pullPolicy: IfNotPresent
  frontend:
    repository: ghcr.io/lambdawp-567/hamq-controller-ui
    tag: latest

replicaCount: 1

controller:
  kafkaNamespace: kafka
  kafkaClusterName: hamq-kafka
  targetNamespaces: "kafka,hamq"

chaos:
  enabled: false
  intervalSeconds: 60
  maxPodsPerRound: 1

service:
  backend:
    type: ClusterIP
    port: 8003
  frontend:
    type: ClusterIP
    port: 3003

ingress:
  enabled: false
  className: nginx
  host: controller.hamq.local

resources:
  backend:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s

auth:
  secretName: hamq-controller-auth

rbac:
  create: true

serviceAccount:
  create: true
  name: hamq-controller

persistence:
  enabled: true
  storageClass: standard
  size: 1Gi
