{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "hamq-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hamq-controller.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # Upgrade WebSocket connections for real-time status stream
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    {{- if and .Values.ingress.tls ((.Values.certManager).enabled) }}
    cert-manager.io/cluster-issuer: {{ .Values.certManager.issuerName | quote }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- if .Values.ingress.tls }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # API and WebSocket traffic → backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "hamq-controller.fullname" . }}-backend
                port:
                  number: {{ .Values.service.backend.port }}
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: {{ include "hamq-controller.fullname" . }}-backend
                port:
                  number: {{ .Values.service.backend.port }}
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: {{ include "hamq-controller.fullname" . }}-backend
                port:
                  number: {{ .Values.service.backend.port }}
          # All other traffic — frontend SPA when enabled, backend otherwise
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "hamq-controller.fullname" . }}-{{- if .Values.image.frontend.enabled }}frontend{{- else }}backend{{- end }}
                port:
                  number:{{- if .Values.image.frontend.enabled }} {{ .Values.service.frontend.port }}{{- else }} {{ .Values.service.backend.port }}{{- end }}
{{- end }}
