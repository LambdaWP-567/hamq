{{- if and .Values.monitoring.enabled .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "hamq-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hamq-controller.labels" . | nindent 4 }}
    # Standard label that Prometheus Operator scrape configs use to discover monitors
    release: prometheus
spec:
  selector:
    matchLabels:
      {{- include "hamq-controller.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      scheme: http
      # Strip high-cardinality labels that would explode the metrics store
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: "go_.*"
          action: drop
{{- end }}
