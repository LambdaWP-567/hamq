# =============================================================================
# HAMq Consumer Helm Chart — values.yaml
# All settings are exposed as Helm values; no hardcoded values in templates.
# =============================================================================

# -----------------------------------------------------------------------------
# Container images
# -----------------------------------------------------------------------------
image:
  backend:
    repository: ghcr.io/lambdawp-567/hamq-consumer
    tag: latest
    pullPolicy: Always
  frontend:
    enabled: true
    repository: ghcr.io/lambdawp-567/hamq-consumer-ui
    tag: latest
    pullPolicy: Always

# Number of consumer pod replicas
replicaCount: 1

# -----------------------------------------------------------------------------
# Kafka connection
# -----------------------------------------------------------------------------
kafka:
  bootstrapServers: "hamq-kafka-bootstrap.kafka.svc.cluster.local:9093"
  topic: "hamq-messages"
  tlsEnabled: true
  # Consumer group ID — consumers sharing the same group share partitions
  groupId: "hamq-consumer-group"
  # Name of the Secret containing ca.crt (created by Strimzi cluster operator)
  caCertSecret: "hamq-cluster-cluster-ca-cert"
  # Name of the KafkaUser Secret containing user.crt / user.key
  userSecret: "hamq-consumer"
  # Offset reset policy when no committed offset exists
  autoOffsetReset: "earliest"

# -----------------------------------------------------------------------------
# Consumer behaviour
# -----------------------------------------------------------------------------
consumer:
  id: "consumer-1"
  autostart: false

# -----------------------------------------------------------------------------
# Authentication
# -----------------------------------------------------------------------------
auth:
  # Secret must contain keys: username, password
  secretName: "hamq-consumer-auth"
  tokenExpireMinutes: 1440

# -----------------------------------------------------------------------------
# Services
# -----------------------------------------------------------------------------
service:
  backend:
    type: ClusterIP
    port: 8001
  frontend:
    type: ClusterIP
    port: 3001

# -----------------------------------------------------------------------------
# Ingress
# -----------------------------------------------------------------------------
ingress:
  enabled: false
  className: nginx
  host: consumer.hamq.local
  tls: false
  # tlsSecretName is used when tls: true
  tlsSecretName: "hamq-consumer-tls"
  annotations: {}

# -----------------------------------------------------------------------------
# Resource requests and limits
# -----------------------------------------------------------------------------
resources:
  backend:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  frontend:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m

# -----------------------------------------------------------------------------
# Persistence — PVC for the SQLite message store
# -----------------------------------------------------------------------------
persistence:
  enabled: true
  storageClass: standard
  size: 5Gi
  accessMode: ReadWriteOnce

# -----------------------------------------------------------------------------
# Monitoring — Prometheus ServiceMonitor
# -----------------------------------------------------------------------------
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    namespace: monitoring
    additionalLabels:
      release: prometheus

# -----------------------------------------------------------------------------
# cert-manager — optional TLS certificate for the Ingress
# -----------------------------------------------------------------------------
certManager:
  enabled: true
  issuerName: selfsigned-issuer
  issuerKind: ClusterIssuer

# -----------------------------------------------------------------------------
# Autoscaling (disabled by default)
# -----------------------------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

# -----------------------------------------------------------------------------
# Pod-level settings
# -----------------------------------------------------------------------------
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Image pull secrets for private registry
imagePullSecrets: []

# Override the chart name or fullname
nameOverride: ""
fullnameOverride: ""
