{{- /*
  IngressRouteTCP with TLS passthrough — Traefik forwards raw TCP on port 443
  using SNI to identify cockpit.hamq.test, then passes the connection straight
  to the Cockpit backend. Traefik never terminates the TLS, so Cockpit's
  own certificate is used end-to-end.
*/ -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: cockpit
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cockpit
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: HostSNI(`{{ .Values.ingress.host }}`)
      services:
        - name: cockpit
          port: {{ .Values.cockpitPort }}
  tls:
    passthrough: true
