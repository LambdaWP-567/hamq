# =============================================================================
# HAMq Arbiter Helm Chart — values.yaml
# All settings are exposed as Helm values; no hardcoded values in templates.
# =============================================================================

# -----------------------------------------------------------------------------
# Container images
# -----------------------------------------------------------------------------
image:
  backend:
    repository: ghcr.io/lambdawp-567/hamq-arbiter
    tag: latest
    pullPolicy: IfNotPresent
  frontend:
    enabled: true
    repository: ghcr.io/lambdawp-567/hamq-arbiter-ui
    tag: latest
    pullPolicy: IfNotPresent

# Number of arbiter pod replicas
replicaCount: 1

# -----------------------------------------------------------------------------
# Arbiter behaviour
# -----------------------------------------------------------------------------
arbiter:
  # Comma-separated list of producer API base URLs
  producerApiUrls: "http://hamq-producer-backend:8000"
  # Consumer API base URL
  consumerApiUrl: "http://hamq-consumer-backend:8001"
  # How often (seconds) to run an automatic reconcile pass
  reconcileIntervalS: 10
  # How far back (seconds) to look when fetching sent/received sequences
  lookbackSeconds: 300

# -----------------------------------------------------------------------------
# Service configuration
# -----------------------------------------------------------------------------
service:
  backend:
    type: ClusterIP
    port: 8002
  frontend:
    type: ClusterIP
    port: 3002

# -----------------------------------------------------------------------------
# Ingress
# -----------------------------------------------------------------------------
ingress:
  enabled: false
  className: nginx
  host: arbiter.hamq.local
  annotations: {}
  tls: []

# -----------------------------------------------------------------------------
# Resource limits / requests
# -----------------------------------------------------------------------------
resources:
  backend:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  frontend:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m

# -----------------------------------------------------------------------------
# Monitoring / Prometheus
# -----------------------------------------------------------------------------
monitoring:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    # Namespace where Prometheus Operator is installed
    namespace: ""
    # Additional labels for the ServiceMonitor (e.g. to match Prometheus selectors)
    additionalLabels: {}

# -----------------------------------------------------------------------------
# Authentication
# -----------------------------------------------------------------------------
auth:
  # Secret must contain keys: username, password
  secretName: hamq-arbiter-auth
  tokenExpireMinutes: 1440

# -----------------------------------------------------------------------------
# Persistence (SQLite audit storage)
# -----------------------------------------------------------------------------
persistence:
  enabled: true
  storageClass: standard
  size: 1Gi
  accessMode: ReadWriteOnce
  mountPath: /data

# -----------------------------------------------------------------------------
# Pod configuration
# -----------------------------------------------------------------------------
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
imagePullSecrets: []

# -----------------------------------------------------------------------------
# Autoscaling (disabled by default for the stateful arbiter)
# -----------------------------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
